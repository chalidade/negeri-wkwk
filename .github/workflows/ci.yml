name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Engine & database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit test engine
        run: npm test
      - name: Uji migration + RLS
        env:
          PGPASSWORD: test
        run: |
          for f in supabase/tests/supabase_stub.sql supabase/migrations/*.sql supabase/tests/rls_test.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check Edge Functions
        working-directory: supabase/functions
        run: deno check */index.ts

