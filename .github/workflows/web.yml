name: Web build

# Build versi web 3D (folder web3d/) lalu simpan ke branch web-preview.
# Vercel men-deploy branch web-preview (folder public/) sebagai production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web3d/package-lock.json
      - run: npm ci
      - name: Build (type check + Vite)
        run: npm run build
      - name: Simpan hasil build ke branch web-preview (folder public/ untuk Vercel)
        run: |
          out="$RUNNER_TEMP/web-preview"
          mkdir -p "$out/public"
          cp -r dist/. "$out/public/"
          cd "$out"
          git init -q -b web-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build web 3D dari ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" web-preview
